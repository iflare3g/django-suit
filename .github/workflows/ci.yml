name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DJANGO_SETTINGS_MODULE: suit.tests.settings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        exclude:
          # Django 4.2, 5.0, 5.1 don't support Python 3.14
          - python-version: "3.14"
            django-version: "4.2"
          - python-version: "3.14"
            django-version: "5.0"
          - python-version: "3.14"
            django-version: "5.1"
          # Django 6.0+ requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv pip install --system "Django~=${{ matrix.django-version }}.0" .
      - name: Run tests
        run: python manage.py test suit
